apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: executor
  template:
    metadata:
      labels:
        app: executor
    spec:
      containers:
        - name: executor
          image: thomasm012/executor:0.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: EXECUTOR_WORKING_DIR
              value: /mnt/satops/executions
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: rabbitmq-config
                  key: rabbitmq-host
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: rabbitmq-user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: rabbitmq-password
            - name: RABBITMQ_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: rabbitmq-config
                  key: rabbitmq-queue
          volumeMounts:
            - name: executions
              mountPath: /mnt/satops
      volumes:
        - name: executions
          hostPath:
            path: /mnt/satops
            type: Directory